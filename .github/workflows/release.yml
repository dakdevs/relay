name: Release

# Tag push vYYYYMMDD.N: build, package and smoke-test every target, then create
# a DRAFT GitHub release. A maintainer reviews and publishes the draft.
# Manual run on a branch: the same build and smoke tests, artifacts only.
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Version matches release/version, Cargo.toml and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            version="$(scripts/version.sh check --tag "$REF_NAME")"
          else
            version="$(scripts/version.sh check)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Release tooling tests
        run: scripts/test.sh

  build:
    needs: verify
    name: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: scripts/ci-linux-deps.sh
      - name: Toolchain (rust-toolchain.toml)
        run: scripts/ci-rust-toolchain.sh "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build relay-desktop
        run: cargo build --release --locked -p relay-desktop --target "$TARGET"
      - name: Third-party licenses
        run: scripts/third-party.sh --target "$TARGET" --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"
      - name: Package
        run: |
          scripts/package.sh archive --target "$TARGET" --binary "target/$TARGET/release/relay" \
            --out dist --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"
          scripts/package.sh sums dist
      - name: Smoke test (install, version, platform checks, startup)
        run: scripts/smoke.sh dist "$TARGET"
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.target }}
          path: dist/relay-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-*
          path: dist
          merge-multiple: true
      - name: Checksums and pinned installer
        run: |
          test "$(find dist -name 'relay-*.tar.gz' | wc -l)" -eq 4
          scripts/package.sh sums dist
          scripts/package.sh installer dist
          cat dist/SHA256SUMS
      - name: Linux runtime libraries
        run: scripts/ci-linux-deps.sh --runtime
      - name: Pinned installer installs the Linux x86_64 archive
        run: |
          home="$(mktemp -d)"
          HOME="$home" RELAY_INSTALL_OS=Linux RELAY_INSTALL_ARCH=x86_64 dist/install.sh --from dist
          test "$("$home/.local/bin/relay" --version)" = "relay $VERSION"
      - name: Create draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting." >&2
            exit 1
          fi
          sed "s/@VERSION@/$VERSION/g" release/notes.md >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --verify-tag --title "Relay $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.tar.gz dist/SHA256SUMS dist/install.sh
