name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  release-tools:
    name: Release tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 has the oldest (strictest) desktop-file-validate we support.
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install shellcheck and desktop-file-utils
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends shellcheck desktop-file-utils
      - name: Version
        run: scripts/version.sh check
      - name: Script tests
        run: scripts/test.sh

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: scripts/ci-linux-deps.sh
      - name: Toolchain (rust-toolchain.toml)
        run: scripts/ci-rust-toolchain.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (backend crates)
        run: cargo clippy --workspace --exclude relay-desktop --all-targets --locked -- -D warnings
      - name: Test (backend crates)
        run: cargo test --workspace --exclude relay-desktop --locked
      - name: Clippy and test (relay-desktop)
        run: |
          cargo clippy -p relay-desktop --all-targets --locked -- -D warnings
          cargo test -p relay-desktop --locked
